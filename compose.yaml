# tcp-wake container deployment (ADR-0003, ADR-0016).
#
# Host networking keeps the listen address and hypha's address on the host's
# own network stack, so the routing entry (ADR-0002) and the wake target need
# no port mapping. The proxy user is the image's non-root user (NFR-8).
#
# The wake tool is etherwake, installed in the image with the CAP_NET_RAW file
# capability (ADR-0016). The one mount that must be supplied is the
# configuration file, which must set wake_mac (and optionally wake_interface);
# the MAC can instead be given as TCPWAKE_WAKE_MAC below, which wins.
services:
  tcp-wake:
    build: .
    image: tcp-wake:latest
    container_name: tcp-wake
    network_mode: host
    restart: on-failure
    user: "10001:10001"
    # Do NOT add no-new-privileges: it would make etherwake's file capability
    # inert and break the wake path (ADR-0016, R-1). No cap_add is needed; the
    # capability lives on the image file, not on the container.
    volumes:
      - ${TCPWAKE_CONFIG_PATH:-./config.toml}:/etc/tcp-wake/config.toml:ro
    # The mounted config must set wake_mac. To override per deployment, add an
    # environment block with TCPWAKE_WAKE_MAC and/or TCPWAKE_WAKE_INTERFACE;
    # the environment wins (ADR-0011). Do not set them to an empty string, which
    # the loader rejects rather than treating as absent.
